[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octop"
version = "1.0.3b5"
description = "Smarter self-hosted AI assistant for multiple users and agents, built on octop-harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{name = "octop contributors"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<2.14",
    "langchain-core>=1.4.8",
    "click>=8.1",
    "rich>=13.7",
    "questionary>=2.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    # harness fine-grained extras — light chains only (pure-Python wheels or
    # with manylinux2014 builds). Heavy chains live in the [deploy-extra]
    # optional-dependencies group below so the offline legacy bundle can
    # resolve without them (see deploy-legacy there).
    "octop-harness[web-search-all,docker,observability,acp]>=1.0.9",
    "octop-memory>=1.0.4",
    "lark-oapi>=1.7.3",
    "octop-gateway>=1.0.3",
    "cryptography>=41",
    "scalar-fastapi>=1.0",
    "edge-tts>=6.1",
    "segno>=1.6",
    "websockets>=13.0",
    # websockets raises "python-socks is required to use a SOCKS proxy" when
    # the host has a SOCKS proxy env and this package is absent — the browser
    # host's CDP connection then fails to attach.
    "python-socks>=2.4",
    "acme>=5.6.0",
    "josepy>=2.2.0",
    "boto3>=1.40.61",
    "octop-browser>=1.0.0",
    "playwright>=1.40",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.9,<2",
    "pillow>=13.0.0",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0",
    "pypinyin>=0.53",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "ldap3>=2.9.1",
    "firecrawl-anydoc>=0.2.4",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
]

[project.optional-dependencies]
# PEP 621 extras — kept so `pip install -e ".[dev]"` keeps working for
# legacy / CI flows. `uv sync` reads `[dependency-groups].dev` below.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]
# Kept for backward compatibility; playwright is now a core dependency.
browser = [
    "playwright>=1.40",
]
# Volcengine TOS object storage (Admin storage kind ``tos``).
tos = ["tos>=2.9,<3"]
# Kept for backward compatibility; pillow is now a core dependency.
desktop = ["mss>=9.0", "pynput>=1.7"]
# Local ONNX / fastembed embedding models (Models admin local tab).
local-embedding = ["fastembed>=0.4", "huggingface_hub>=0.20"]
knowledge-ocr = [
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.17",
    "pymupdf>=1.24",
    "shapely>=2.2.0",
]
# Offline-friendly deploy target for the legacy (manylinux2014/glibc 2.17)
# bundle: `uv export --no-all-extras --extra deploy-legacy` resolves without
# the chains whose wheels have no 2014-tier build. Harness fine-grained
# extras mirror packages/octop-harness/pyproject.toml; keep the two lists in
# sync when upstream adds a new feature extra. offline_bundle.sh
# VARIANT=legacy uses this; standard/Docker install deploy-full instead.
deploy-legacy = [
    "octop-harness[web-search-all,docker,observability,acp]>=1.0.9",
]
# Full-featured deploy target (Docker image, standard offline bundle):
# re-adds the heavy chains excluded from deploy-legacy — cloud-storage SDKs
# (object-storage), Bedrock (numpy>=2.3.2), remote COS/S3/PG backends
# (psycopg>=3.3.2), keyboard/mouse control (desktop), plus root-level
# local-embedding / knowledge-ocr / tos which are NOT installed by default
# for the same reason (no 2014-tier wheels on their native chains).
# Dockerfile and offline_bundle.sh standard variant pass `--extra deploy-full`.
deploy-full = [
    "octop-harness[bedrock,object-storage,desktop,remote-backends]>=1.0.9",
    "fastembed>=0.4",
    "huggingface_hub>=0.20",
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.17",
    "pymupdf>=1.24",
    "shapely>=2.2.0",
    "tos>=2.9,<3",
]

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`. Mirrors the
# `[project.optional-dependencies].dev` list above.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]

[project.scripts]
octop = "octop.cli.main:cli"

# Pin the official index so lockfile URLs never drift to a developer's
# local mirror config (~/.config/uv/uv.toml). CI and offline bundles rely on
# these URLs being canonical.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
octop-harness = { workspace = true }
octop-gateway = { workspace = true }
octop-memory = { workspace = true }
octop-browser = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/octop"]

[tool.hatch.build]
include = [
    "src/octop/**/*.py",
    "src/octop/**/*.json",
    "src/octop/**/*.md",
    "src/octop/**/*.sql",
    "src/octop/**/*.sh",
    "src/octop/**/*.png",
    "src/octop/dashboard/**/*",
    "src/octop/bigscreen/**/*",
    "src/octop/infra/agents/experts/library/**/*",
    "src/octop/infra/agents/plugins/bundled/**/*",
    "src/octop/infra/agents/subagents/library/**/*",
    "src/octop/infra/agents/subagents/divisions.json",
    "src/octop/infra/control/desktop/scripts/**/*",
]
artifacts = [
    "src/octop/dashboard/**/*",
    "src/octop/bigscreen/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/octop/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/octop"]
exclude = [
    "src/octop/dashboard/",
    "src/octop/bigscreen/",
    "src/octop/infra/agents/experts/library/",
    "src/octop/infra/agents/plugins/bundled/",
    "src/octop/infra/agents/subagents/library/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.auth"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.health"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.setup"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.users"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.agents"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.providers"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.chat"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.channels"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.cron"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.admin"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.app"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.infra.utils.posix_compat"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "octop.infra.utils.subprocess_io_win"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit real LLM / external services (skipped by default)",
    "slow: expensive tests (integration boot, real harness, browser); skipped by make test-fast",
    "postgresql: tests that need a live PostgreSQL (set OCTOP_TEST_DATABASE_URL)",
]
# The project pins a starlette fork (1.3.1) whose TestClient prefers a
# private ``httpx2`` build that is not installable from PyPI. When ``httpx2``
# is absent it falls back to ``httpx`` and emits a non-actionable
# StarletteDeprecationWarning on every ``starlette.testclient`` import. The
# fallback is intentional for this environment, so silence the noise.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
